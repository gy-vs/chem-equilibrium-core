[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "chem-equilibrium-core"
version = "0.1.0"
description = "Ideal-solution chemical equilibrium kernel for batch solution preparation"
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["numpy>=1.21"]
license = {text = "MIT"}

[tool.setuptools.packages.find]
where = ["src"]
